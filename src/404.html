<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wrong number | Just Fax</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- No <script> here: the CSP in dist/_headers only allows index.html's script hash. -->
<style>
:root{--desk:#1F3DF0; --paper:#FFFFFF; --ink:#16161D; --soft:#4B4B57; --rule:#D5DBF3; --hi:#F2FF3D}
@media (prefers-color-scheme: dark){ :root{--desk:#0A1233; --paper:#F1F1EF} }
*{box-sizing:border-box}
body{margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--desk); color:var(--ink); font:18px/1.55 "Courier New", Courier, monospace}
main{width:100%; max-width:520px; background:var(--paper); padding:32px 28px; border-radius:4px; box-shadow:0 18px 36px rgba(6,10,50,.45); transform:rotate(-1deg)}
.head{margin:0 0 20px; padding-bottom:12px; border-bottom:2px dashed var(--rule); font-size:13px; letter-spacing:.12em; color:var(--soft)}
h1{margin:0 0 12px; font:800 40px/1.05 "Arial Black", system-ui, sans-serif}
a{display:inline-block; margin-top:8px; padding:12px 18px; min-height:44px; border-radius:6px; background:var(--hi); color:var(--ink); font-weight:700; text-decoration:none}
a:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="head">FAX TRANSMISSION. ERROR 404.</p>
  <h1>Wrong number.</h1>
  <p>Nothing is on this line. Fax picks up at the main number.</p>
  <a href="/">Back to Just Fax</a>
</main>
</body>
</html>
